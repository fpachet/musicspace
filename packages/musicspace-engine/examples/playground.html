<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicSpace engine · Playground</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f3f2ef;
      color: #21362e;
      font:
        16px system-ui,
        sans-serif;
    }
    main {
      max-width: 960px;
      margin: 45px auto;
      padding: 0 24px;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 12px;
      color: #597469;
    }
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -0.04em;
      margin: 12px 0;
    }
    p {
      max-width: 720px;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin: 24px 0 16px;
    }
    button,
    select {
      font: inherit;
      border: 1px solid #bdcbc4;
      padding: 10px 14px;
      border-radius: 8px;
      background: white;
      color: inherit;
    }
    button {
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    svg {
      width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid #d1dcd5;
      border-radius: 16px;
      touch-action: none;
    }
    circle {
      cursor: grab;
    }
    circle:active {
      cursor: grabbing;
    }
    svg text {
      pointer-events: none;
      font-size: 15px;
      fill: #21362e;
    }
    #status {
      font-size: 14px;
      min-height: 24px;
      color: #526d61;
    }
    a {
      color: #176945;
    }
  </style>
  <main>
    <div class="eyebrow">MusicSpace · JavaScript engine</div>
    <h1>Your interface. Shared constraints.</h1>
    <p>
      Drag the points to explore geometric relationships, compound motion and spring dynamics. This SVG
      interface uses the standalone package.
    </p>
    <div class="toolbar">
      <select id="scene" aria-label="Example">
        <option value="balance">01 · Balance around a moving center</option>
        <option value="rotator">02 · Rotating constellation</option>
        <option value="spring">03 · Coupled springs</option>
      </select>
      <button id="play">Pause motion</button>
      <button id="reset">Reset</button>
      <button id="save">Save scene</button>
      <button id="load">Load scene</button>
      <input id="file" type="file" accept=".json,application/json" hidden />
    </div>
    <p id="hint"></p>
    <svg id="canvas" viewBox="0 0 800 500" aria-label="Interactive constraint scene"></svg>
    <p id="status" role="status"></p>
    <p>
      Inspect <a href="./playground.mjs">the example source</a> or read the
      <a href="../README.md">package guide</a>.
    </p>
  </main>
  <script type="module" src="./playground.mjs"></script>
</html>
