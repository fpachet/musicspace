<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicSpace</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4ef;
      color: #1f2933;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    button {
      border: 1px solid #b9c1c9;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2933;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      min-height: 36px;
      padding: 0 12px;
    }

    button:hover {
      border-color: #52616f;
      background: #f8fafc;
    }

    .stage {
      position: relative;
      width: min(100%, 800px);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      border: 1px solid #b9c1c9;
      background: #fbfbf8;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #canvas {
      z-index: 2;
    }

    #trace {
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      main {
        padding: 16px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>MusicSpace</h1>
      <div class="toolbar" aria-label="MusicSpace controls">
        <button id="animation-toggle" type="button">Start</button>
        <button id="reset" type="button">Reset</button>
        <button id="clear-trace" type="button">Clear Trace</button>
        <button id="save-trace" type="button">Save Trace</button>
      </div>
    </header>
    <div class="stage">
      <canvas id="trace" width="800" height="600"></canvas>
      <canvas id="canvas" width="800" height="600"></canvas>
    </div>
  </main>
  <script src="musicspace.js"></script>
</body>
</html>
