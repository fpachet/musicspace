<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicSpace</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4ef;
      color: #1f2933;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .mode-group {
      display: inline-flex;
      align-items: center;
      gap: 0;
      min-height: 36px;
      border: 1px solid #b9c1c9;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
    }

    .tool-palette {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      width: min(100%, 800px);
      margin: 0 auto 12px;
    }

    .mode-label {
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border-right: 1px solid #d4dae1;
      color: #52616f;
      font-size: 13px;
      font-weight: 700;
    }

    button,
    select {
      border: 1px solid #b9c1c9;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2933;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      min-height: 36px;
      padding: 0 12px;
    }

    select {
      min-width: 190px;
    }

    .mode-group button {
      border: 0;
      border-radius: 0;
      min-height: 34px;
    }

    button[aria-pressed="true"] {
      background: #111827;
      color: #ffffff;
    }

    .tool-palette button {
      min-width: 42px;
      padding: 0 9px;
      font-size: 13px;
      font-weight: 700;
    }

    button:hover {
      border-color: #52616f;
      background: #f8fafc;
    }

    select:hover {
      border-color: #52616f;
    }

    .mode-group button:hover,
    button[aria-pressed="true"]:hover {
      background: #1f2933;
      color: #ffffff;
    }

    .status {
      min-height: 22px;
      margin: -4px auto 12px;
      width: min(100%, 800px);
      color: #7c2d12;
      font-size: 13px;
      line-height: 1.4;
    }

    .stage {
      position: relative;
      width: min(100%, 800px);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      border: 1px solid #b9c1c9;
      background: #fbfbf8;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #canvas {
      z-index: 2;
      cursor: grab;
      touch-action: none;
    }

    .stage.is-dragging #canvas {
      cursor: grabbing;
    }

    #canvas:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    #trace {
      z-index: 1;
      pointer-events: none;
    }

    .editor-panel {
      width: min(100%, 800px);
      margin: 12px auto 0;
      padding: 12px;
      border: 1px solid #b9c1c9;
      border-radius: 6px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
    }

    .editor-panel[hidden] {
      display: none;
    }

    .editor-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .editor-grid label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: #52616f;
      font-size: 13px;
      font-weight: 700;
    }

    .editor-grid input,
    .editor-grid select {
      width: 100%;
    }

    .editor-check {
      flex-direction: row !important;
      align-items: center;
      color: #1f2933 !important;
    }

    .editor-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .audio-panel {
      width: min(100%, 800px);
      margin: 12px auto 0;
      padding: 12px;
      border: 1px solid #b9c1c9;
      border-radius: 6px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
    }

    .audio-panel[hidden] {
      display: none;
    }

    .audio-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
    }

    .audio-param {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
      min-height: 32px;
      padding: 7px 9px;
      border: 1px solid #d4dae1;
      border-radius: 6px;
      background: #f8fafc;
      color: #52616f;
      font-size: 13px;
      font-weight: 700;
    }

    .audio-param output {
      color: #111827;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 720px) {
      main {
        padding: 16px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .mode-group {
        width: 100%;
      }

      .mode-group button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>MusicSpace</h1>
      <div class="toolbar" aria-label="MusicSpace controls">
        <select id="patch-select" aria-label="Load built-in patch"></select>
        <button id="save-patch" type="button">Save Patch</button>
        <button id="load-patch" type="button">Load Patch</button>
        <input id="patch-file" type="file" accept="application/json,.json" hidden>
        <div class="mode-group" aria-label="Listener drag mode">
          <span class="mode-label">Listener</span>
          <button id="listener-mode-retarget" type="button" title="Move the listener and retarget constraints to the new geometry">Re-anchor</button>
          <button id="listener-mode-preserve" type="button" title="Move the listener while preserving the current constraints">Preserve</button>
        </div>
        <button id="animation-toggle" type="button" aria-pressed="false">Start</button>
        <button id="audio-toggle" type="button" aria-pressed="false">Sound Off</button>
        <button id="undo" type="button" title="Undo last edit">Undo</button>
        <button id="trace-selected" type="button" aria-pressed="false" title="Toggle drawing for the selected object">Draw Selected</button>
        <button id="reset" type="button">Reset</button>
        <button id="clear-trace" type="button">Clear Trace</button>
        <button id="save-trace" type="button">Save Trace</button>
      </div>
    </header>
    <div class="tool-palette" aria-label="Creation tools">
      <button type="button" data-tool="select" aria-pressed="true" title="Select and drag">Select</button>
      <button type="button" data-tool="source" title="Create source">Src</button>
      <button type="button" data-tool="mover" title="Create moving object">Mover</button>
      <button type="button" data-tool="angle" title="Create angle constraint">Angle</button>
      <button type="button" data-tool="sum" title="Create balance/sum constraint">Sum</button>
      <button type="button" data-tool="product" title="Create product constraint">Prod</button>
      <button type="button" data-tool="radialLimit" title="Create radial limit">Limit</button>
      <button type="button" data-tool="fixedDistance" title="Create fixed distance constraint">Dist</button>
      <button type="button" data-tool="distanceRatio" title="Create distance ratio constraint">Ratio</button>
      <button type="button" data-tool="pin" title="Pin object">Pin</button>
      <button type="button" data-tool="solid" title="Create solid attachment">Link</button>
      <button type="button" data-tool="separation" title="Create minimum separation">Sep</button>
      <button type="button" data-tool="angleSector" title="Create angle sector">Sector</button>
      <button type="button" data-tool="translateTrajectory" title="Assign translation trajectory">Move</button>
      <button type="button" data-tool="rotateTrajectory" title="Assign orbital trajectory around the listener">Orbit</button>
      <button type="button" data-tool="rotatorTrajectory" title="Create/edit rotative object">Spin</button>
      <button type="button" data-tool="shuttleTrajectory" title="Assign shuttle trajectory">Shuttle</button>
      <button type="button" data-tool="bounceTrajectory" title="Assign bounce trajectory">Bounce</button>
    </div>
    <p id="constraint-status" class="status" aria-live="polite"></p>
    <div id="stage" class="stage">
      <canvas id="trace" width="800" height="600"></canvas>
      <canvas
        id="canvas"
        width="800"
        height="600"
        tabindex="0"
        role="application"
        aria-label="MusicSpace canvas. Drag sources, the listener, or constraint nodes. Arrow keys nudge the selected object."></canvas>
    </div>
    <section id="audio-panel" class="audio-panel" aria-label="Audio parameter monitor" hidden>
      <h2>Faust Patch Control</h2>
      <div id="audio-grid" class="audio-grid"></div>
    </section>
    <section id="rotation-editor" class="editor-panel" aria-label="Rotative constraint editor" hidden>
      <h2>Rotative Constraint Editor</h2>
      <div class="editor-grid">
        <label class="editor-check">
          <input id="rotation-running" type="checkbox">
          Start
        </label>
        <label class="editor-check">
          <input id="rotation-displacement" type="checkbox">
          Displacement induces rotation
        </label>
        <label>
          Revolution period (seconds)
          <input id="rotation-period" type="number" min="0.5" step="0.5" value="20">
        </label>
        <label>
          Direction
          <select id="rotation-direction">
            <option value="1">Positive</option>
            <option value="-1">Negative</option>
          </select>
        </label>
      </div>
      <div class="editor-actions">
        <button id="rotation-apply" type="button">Apply</button>
        <button id="rotation-close" type="button">Close</button>
      </div>
    </section>
    <section id="shuttle-editor" class="editor-panel" aria-label="Shuttle trajectory editor" hidden>
      <h2>Shuttle Trajectory Editor</h2>
      <div class="editor-grid">
        <label>
          Start endpoint
          <select id="shuttle-start-ref"></select>
        </label>
        <label>
          End endpoint
          <select id="shuttle-end-ref"></select>
        </label>
        <label>
          Fixed start X
          <input id="shuttle-start-x" type="number" step="1">
        </label>
        <label>
          Fixed start Y
          <input id="shuttle-start-y" type="number" step="1">
        </label>
        <label>
          Fixed end X
          <input id="shuttle-end-x" type="number" step="1">
        </label>
        <label>
          Fixed end Y
          <input id="shuttle-end-y" type="number" step="1">
        </label>
        <label>
          Speed
          <input id="shuttle-speed" type="number" min="0.001" step="0.001">
        </label>
        <label class="editor-check">
          <input id="shuttle-show-path" type="checkbox">
          Show dotted shuttle line
        </label>
      </div>
      <div class="editor-actions">
        <button id="shuttle-apply" type="button">Apply</button>
        <button id="shuttle-close" type="button">Close</button>
      </div>
    </section>
  </main>
  <script src="musicspace-mapping.js"></script>
  <script src="musicspace-targets.js"></script>
  <script src="musicspace.js"></script>
</body>
</html>
